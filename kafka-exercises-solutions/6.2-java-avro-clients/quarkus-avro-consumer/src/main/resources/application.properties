mp.messaging.incoming.employees-avro.connector=smallrye-kafka
mp.messaging.incoming.employees-avro.topic=employees-avro
mp.messaging.incoming.employees-avro.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.employees-avro.key.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.employees-avro.auto.offset.reset=earliest
mp.messaging.incoming.employees-avro.enable.auto.commit=false
# Failed records go to the DLQ topic, original headers are kept and dead-letter-* headers are added
mp.messaging.incoming.employees-avro.failure-strategy=dead-letter-queue
# Without this a poison pill (undeserializable record) stops the channel instead of going to the DLQ
mp.messaging.incoming.employees-avro.fail-on-deserialization-failure=false
mp.messaging.incoming.employees-avro.dead-letter-queue.topic=employees-avro-dlq
mp.messaging.incoming.employees-avro.dead-letter-queue.key.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.incoming.employees-avro.dead-letter-queue.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.connector.smallrye-kafka.schema.registry.url=http://localhost:8081

kafka.bootstrap.servers=localhost:9092
quarkus.devservices.enabled=false
